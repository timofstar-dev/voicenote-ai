<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceNote AI — 음성 녹음 AI 정리</title>
    <meta name="description" content="브라우저에서 음성을 녹음하고 AI가 자동으로 요약, 회의록, 할일 목록, 마인드맵으로 정리해드립니다.">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#07071a">
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VoiceNote AI">
    <link rel="apple-touch-icon" href="/icons/icon-512.jpg">
    <!-- Fonts & Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>설정</h3>
                <button id="closeSettings" class="icon-btn" aria-label="닫기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="apiKeyInput">Claude API 키</label>
                    <div class="input-wrapper">
                        <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off">
                        <button id="toggleApiKey" class="icon-btn-sm" aria-label="API 키 보기/숨기기">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="form-hint">프로토타입용으로 브라우저에서 직접 API를 호출합니다.<br>실서비스에서는 백엔드 프록시를 사용해야 합니다.</p>
                </div>
                <div class="form-group">
                    <label for="langSelect">음성 인식 언어</label>
                    <select id="langSelect">
                        <option value="ko-KR" selected>한국어 (ko-KR)</option>
                        <option value="en-US">English (en-US)</option>
                        <option value="ja-JP">日本語 (ja-JP)</option>
                        <option value="zh-CN">中文 (zh-CN)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modelSelect">Claude 모델</label>
                    <select id="modelSelect">
                        <option value="claude-sonnet-4-20250514" selected>Claude Sonnet 4</option>
                        <option value="claude-opus-4-20250514">Claude Opus 4</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="demoModeBtn" class="btn-ghost">데모 모드 체험</button>
                <button id="saveSettings" class="btn-primary-sm">저장</button>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app">
        <!-- Header -->
        <header id="appHeader">
            <div class="header-left">
                <button id="backBtn" class="icon-btn hidden" aria-label="뒤로가기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <defs><linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
                            <rect x="9" y="1" width="6" height="11" rx="3"/>
                            <path d="M5 10a7 7 0 0 0 14 0"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                        </svg>
                    </div>
                    <span class="logo-text">VoiceNote <span class="logo-ai">AI</span></span>
                </div>
            </div>
            <div class="header-right">
                <button id="settingsBtn" class="icon-btn" aria-label="설정">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </header>

        <!-- Screen: Record -->
        <main id="screenRecord" class="screen active">
            <div class="record-container">
                <div class="record-status" id="recordStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">준비</span>
                </div>
                <div class="timer" id="timer">00:00</div>
                <div class="record-btn-wrapper">
                    <div class="pulse-ring ring-1"></div>
                    <div class="pulse-ring ring-2"></div>
                    <div class="pulse-ring ring-3"></div>
                    <button id="recordBtn" class="record-btn" aria-label="녹음">
                        <svg class="mic-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="1" width="6" height="11" rx="3"/>
                            <path d="M5 10a7 7 0 0 0 14 0"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                        </svg>
                        <svg class="stop-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="4" y="4" width="16" height="16" rx="3"/>
                        </svg>
                    </button>
                </div>
                <p class="record-hint" id="recordHint">마이크 버튼을 눌러 녹음을 시작하세요</p>
                <canvas id="waveform" width="600" height="100"></canvas>
                <div class="live-transcript-wrapper" id="liveTranscriptWrapper">
                    <div class="live-transcript-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        실시간 텍스트 변환
                    </div>
                    <div class="live-transcript" id="liveTranscript">
                        <span class="transcript-final" id="transcriptFinal"></span>
                        <span class="transcript-interim" id="transcriptInterim"></span>
                        <span class="transcript-cursor"></span>
                    </div>
                </div>
            </div>
            <div class="record-actions" id="recordActions">
                <button id="editBtn" class="btn-primary hidden">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    편집 및 AI 정리
                </button>
            </div>
        </main>

        <!-- Screen: Edit -->
        <main id="screenEdit" class="screen">
            <div class="edit-container">
                <div class="edit-card">
                    <div class="edit-card-header">
                        <h2>녹음 텍스트 편집</h2>
                        <button id="clearText" class="icon-btn-sm" title="전체 삭제">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <textarea id="editArea" placeholder="녹음된 텍스트가 여기에 표시됩니다. 직접 수정할 수 있습니다."></textarea>
                    <div class="stats-bar">
                        <span id="wordCount">0 단어</span>
                        <span class="stats-divider">·</span>
                        <span id="charCount">0 자</span>
                    </div>
                </div>
                <button id="aiBtn" class="btn-primary btn-ai">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    AI 정리 시작
                </button>
            </div>
        </main>

        <!-- Screen: Loading -->
        <main id="screenLoading" class="screen">
            <div class="loading-container">
                <div class="loading-orb">
                    <div class="orb-ring orb-ring-1"></div>
                    <div class="orb-ring orb-ring-2"></div>
                    <div class="orb-ring orb-ring-3"></div>
                    <div class="orb-core">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                    </div>
                </div>
                <h3 class="loading-title">AI가 텍스트를 분석하고 있습니다</h3>
                <p class="loading-subtitle">요점정리 · 회의록 · 할 일 · 마인드맵을 생성 중...</p>
                <div class="loading-progress">
                    <div class="loading-bar"></div>
                </div>
            </div>
        </main>

        <!-- Screen: Results -->
        <main id="screenResults" class="screen">
            <div class="results-container">
                <div class="tabs-wrapper">
                    <div class="tabs" id="tabs">
                        <button class="tab active" data-tab="summary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            요점정리
                        </button>
                        <button class="tab" data-tab="meeting">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            회의록
                        </button>
                        <button class="tab" data-tab="todos">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                            할 일
                        </button>
                        <button class="tab" data-tab="mindmap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><path d="M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                            마인드맵
                        </button>
                        <div class="tab-indicator" id="tabIndicator"></div>
                    </div>
                </div>
                <div class="tab-content-wrapper">
                    <div id="tabSummary" class="tab-panel active"></div>
                    <div id="tabMeeting" class="tab-panel"></div>
                    <div id="tabTodos" class="tab-panel"></div>
                    <div id="tabMindmap" class="tab-panel">
                        <div id="mermaidContainer"></div>
                    </div>
                </div>
                <div class="result-actions">
                    <button id="copyResult" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        복사
                    </button>
                    <button id="downloadResult" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        다운로드
                    </button>
                    <button id="newRecording" class="btn-primary-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        새 녹음
                    </button>
                </div>
            </div>
        </main>

        <!-- Browser Support Warning -->
        <div id="browserWarning" class="browser-warning hidden">
            <div class="warning-card">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <h3>브라우저 호환성 알림</h3>
                <p>Web Speech API는 <strong>Chrome</strong> 계열 브라우저에서 가장 안정적으로 동작합니다.<br>최상의 경험을 위해 Chrome 또는 Edge 브라우저를 사용해주세요.</p>
                <button id="dismissWarning" class="btn-primary-sm">확인</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
